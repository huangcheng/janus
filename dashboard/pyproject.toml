[project]
name = "janus-dashboard"
version = "0.1.0"
description = "Janus gateway management plane: multi-node dashboard with FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "cryptography>=43.0",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",
    "pydantic>=2.9",
    "PyJWT>=2.9",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
]

# Fresh installs (CI runners) hit setuptools' flat-layout auto-discovery:
# spa/, deploy/, reports/, artifacts/ look like top-level packages and the
# editable build aborts. Only the backend package ships.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's `x = Depends(...)` idiom is the framework's intended
# pattern in router signatures — flagging it is noise here.
# BLE001: blind excepts are deliberate in pollers/webhook drains and
# alert paths: they must never take the loop down.
ignore = [
  "BLE001",
  # ISC004: long SQL literals are split across lines with implicit
  # concatenation throughout; parenthesizing 12 query strings adds
  # diff noise with zero behavior change.
  "ISC004",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.File"]


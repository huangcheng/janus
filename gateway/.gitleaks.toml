# Gitleaks configuration for Janus.
# Extends the default ruleset with patterns specific to this project's
# secret conventions (JSEC/JSNP envelopes, JANUS_* env vars, provider keys).

title = "janus-gitleaks-config"

[extend]
# Inherit all built-in rules (API keys, AWS, private keys, tokens, etc.)
useDefault = true

[[rules]]
id = "janus-secrets-env"
description = "Janus secrets keyring env var"
regex = '''JANUS_SECRETS_KEY\s*=\s*[^\s]{10,}'''
tags = ["janus", "keyring"]

[[rules]]
id = "janus-pepper-env"
description = "Janus API key pepper env var"
regex = '''JANUS_API_KEY_PEPPER\s*=\s*[^\s]{6,}'''
tags = ["janus", "pepper"]

[[rules]]
id = "janus-dashboard-password"
description = "Janus dashboard password env var"
regex = '''JANUS_DASHBOARD_PASSWORD\s*=\s*[^\s]{4,}'''
tags = ["janus", "password"]

[[rules]]
id = "janus-secrets-keyring-config"
description = "Janus secrets keyring in config file"
regex = '''\{secrets_keyring[^}]*\}'''
tags = ["janus", "keyring"]

[[rules]]
id = "sk-provider-key"
description = "Provider API key (sk- prefix)"
regex = '''sk-[a-zA-Z0-9_-]{20,}'''
tags = ["provider", "apikey"]

[[rules]]
id = "ark-key"
description = "Volcengine Ark API key"
regex = '''ark-[a-f0-9-]{30,}'''
tags = ["provider", "volcengine"]

[[rules]]
id = "dashscope-key"
description = "DashScope API key"
regex = '''sk-[a-f0-9]{32}'''
tags = ["provider", "dashscope"]

[[rules]]
id = "zhipu-key"
description = "Zhipu API key (hex.hex format)"
regex = '''[a-f0-9]{32}\.[A-Za-z0-9]{16}'''
tags = ["provider", "zhipu"]

[[rules]]
id = "minimax-key"
description = "MiniMax API key"
regex = '''sk-cp-[A-Za-z0-9_-]{40,}'''
tags = ["provider", "minimax"]

[[rules]]
id = "kimi-key"
description = "Kimi/Moonshot API key"
regex = '''sk-kimi-[A-Za-z0-9_-]{30,}'''
tags = ["provider", "kimi"]

[[rules]]
id = "erlang-cookie"
description = "Erlang distribution cookie in config"
regex = '''-setcookie\s+\S+'''
tags = ["erlang", "cookie"]

[[rules]]
id = "postgres-password"
description = "Postgres password in connection string or compose"
regex = '''POSTGRES_PASSWORD\s*[:=]\s*\S+|postgres://[^:\s]+:[^@\s]+@'''
tags = ["database", "postgres"]

# Allow known-safe patterns to pass through
[allowlist]
description = "Global allowlist"
paths = [
    '''(^|/)\.gitignore$''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)\.github/workflows/.*\.yml$''',
    '''(^|/)docs/WSL2-DEV\.md$''',        # has env var NAMES but no values
    '''(^|/)design/.*''',                  # design docs reference patterns, not live keys
    '''(^|/)rebar\.lock$''',
    # fleet spec + audit snapshots quote the cookie placeholder in prose
    '''(^|/)docs/(audit|superpowers)/target\.md$''',
    '''(^|/)docs/audit/archive/.*\.md$''',
]
regexes = [
    '''sk-\[REDACTED\]''',
    '''\*\*\*REDACTED\*\*\*''',
    '''JANUS_SECRETS_KEY=.*\$.*\{''',        # CI variable substitution, not literal
    '''JANUS_API_KEY_PEPPER=dev''',           # dev/CI placeholder
    '''JANUS_DASHBOARD_PASSWORD=dev''',       # dev/CI placeholder
    '''sk-8e91e931c68c4e069df943229419731c''', # already-rotated benchmark key (in .gitignore'd files only)
    # erlang-cookie rule fires on ${JANUS_ERLANG_COOKIE} variable SYNTAX
    # in spec/audit docs — a ${VAR} placeholder can never be a secret
    # erlang-cookie rule fires on ${JANUS_ERLANG_COOKIE} variable SYNTAX
    # (a ${VAR} placeholder can never be a secret)
    '''-setcookie ["`]?\$\{?JANUS_ERLANG_COOKIE'''
]


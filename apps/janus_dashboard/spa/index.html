<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="%BASE_URL%icon.png" type="image/png">
  <title>Janus Dashboard</title>
  <script>
    // Set the theme before first paint to avoid a flash; light is default.
    try {
      if (localStorage.getItem('janus-theme') === 'dark') {
        document.documentElement.classList.add('dark')
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

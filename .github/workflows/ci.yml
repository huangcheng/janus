name: ci

# Merge-to-main policy (2026-10-14): CI builds ONLY on main merges and
# manual dispatch — feature work happens on develop / short-lived
# branches and is NOT built per-push (Actions budget discipline).
#
# Verification policy (2026-11-02): the earlier "no checked-in tests" rule
# is superseded. This repository DOES ship EUnit suites (19 standalone
# modules plus inline `-ifdef(TEST)` tests, 179 tests at the time of the
# change), and they now run here. The gate is deliberately not just
# "rebar3 eunit exited 0": that command also succeeds when a project has no
# tests, so `assert_eunit_nonempty.sh` makes zero-executed and unparseable
# output hard failures. Live browser/curl verification remains the primary
# end-to-end proof; checked-in tests are additive and never replace it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: gateway

jobs:
  erlang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"

      - uses: actions/cache@v4
        with:
          path: gateway/_build
          # Keyed on the lockfile alone: a broad gateway prefix in
          # restore-keys would resurrect stale build output after a
          # dependency change, which is worse than a cold build.
          key: gateway-${{ hashFiles('gateway/rebar.lock') }}

      - name: Compile
        run: rebar3 compile

      - name: Format check
        run: rebar3 fmt --check

      - name: EUnit gate self-test
        # The gate's whole value is its PARSER. Test it before trusting it:
        # the cases are the real summary shapes rebar3 and EUnit emit.
        run: ./scripts/verification/selftest_assert_eunit_nonempty.sh

      - name: EUnit (non-vacuous)
        # The wrapper fails on: nonzero eunit exit, any failure, no summary,
        # a zero-count suite, or a summed total of zero. It resolves the app
        # root from its own path, so the working directory does not matter.
        run: ./scripts/verification/assert_eunit_nonempty.sh

  judge-sidecar:
    # `gateway/sidecars/janus_judge` ships 12 pytest cases that nothing ran,
    # the same rot risk as the EUnit suites had. It is a separate Python
    # component with its own requirements, so it gets its own job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/sidecars/janus_judge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        # `.[dev]` is what brings in ruff, which lint_all.sh requires; without
        # it the lint step fails with "ruff not installed" rather than linting.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install SPA dependencies
        # BEFORE the lint step: lint_all.sh runs the SPA typecheck and build
        # when spa/node_modules exists, so installing after it would skip the
        # type gate while still reporting success.
        working-directory: dashboard/spa
        run: npm ci

      - name: Lint (Python + SPA)
        run: bash scripts/lint_all.sh

      - name: Typecheck (SPA)
        working-directory: dashboard/spa
        run: npm run typecheck

      - name: Build (SPA)
        working-directory: dashboard/spa
        run: npm run build

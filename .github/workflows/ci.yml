name: ci

# Merge-to-main policy (2026-10-14): CI builds ONLY on main merges and
# manual dispatch — feature work happens on develop / short-lived
# branches and is NOT built per-push (Actions budget discipline).
#
# Verification policy (2026-11-02): the earlier "no checked-in tests" rule
# is superseded. This repository DOES ship EUnit suites (19 standalone
# modules plus inline `-ifdef(TEST)` tests, 179 tests at the time of the
# change), and they now run here. The gate is deliberately not just
# "rebar3 eunit exited 0": that command also succeeds when a project has no
# tests, so `assert_eunit_nonempty.sh` makes zero-executed and unparseable
# output hard failures. Live browser/curl verification remains the primary
# end-to-end proof; checked-in tests are additive and never replace it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: gateway

jobs:
  erlang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"

      - uses: actions/cache@v4
        with:
          path: gateway/_build
          # Keyed on the lockfile alone: a broad gateway prefix in
          # restore-keys would resurrect stale build output after a
          # dependency change, which is worse than a cold build.
          key: gateway-${{ hashFiles('gateway/rebar.lock') }}

      - name: Compile
        run: rebar3 compile

      - name: Format check
        run: rebar3 fmt --check

      - name: EUnit gate self-test
        # The gate's whole value is its PARSER. Test it before trusting it:
        # the cases are the real summary shapes rebar3 and EUnit emit.
        run: ./scripts/verification/selftest_assert_eunit_nonempty.sh

      - name: Remote calls resolve
        # Every `mod:fun(...)` must name a function that module exports.
        # Erlang resolves remote calls at RUNTIME, so a call to a
        # module-internal function compiles cleanly and passes EUnit, then
        # fails with `undef` in production — 2026-11-05 that took the master
        # down on boot (janus_config -> janus_http_sup:idle_timeout_ms/0).
        # Neither the compiler, EUnit, nor the diff-scoped code reviewer
        # sees this class, so it gets its own gate.
        run: escript scripts/verification/check_remote_exports.escript

      - name: EUnit (non-vacuous)
        # The wrapper fails on: nonzero eunit exit, any failure, no summary,
        # a zero-count suite, or a summed total of zero. It resolves the app
        # root from its own path, so the working directory does not matter.
        run: ./scripts/verification/assert_eunit_nonempty.sh

      - name: Source line budget (OCR scannable)
        # Soft warn >2500; hard fail >4000 (OCR skips `too_large` files).
        working-directory: .
        run: ./scripts/verification/assert_source_line_budget.sh

  ocr:
    # Every commit in the push must pass OCR (critical/high = fail).
    # Requires repository secrets: OCR_LLM_URL, OCR_LLM_TOKEN, OCR_LLM_MODEL
    # (optional OCR_USE_ANTHROPIC=true for Anthropic-compatible endpoints).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install open-code-review
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure OCR LLM
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
          OCR_USE_ANTHROPIC: ${{ secrets.OCR_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          if [[ -z "${OCR_LLM_URL:-}" || -z "${OCR_LLM_TOKEN:-}" || -z "${OCR_LLM_MODEL:-}" ]]; then
            echo "FAIL: OCR_LLM_URL / OCR_LLM_TOKEN / OCR_LLM_MODEL secrets required" >&2
            exit 1
          fi
          # Prefer env vars (highest priority per ocr docs); also persist
          # for any subprocess that only reads config.
          {
            echo "OCR_LLM_URL=$OCR_LLM_URL"
            echo "OCR_LLM_TOKEN=$OCR_LLM_TOKEN"
            echo "OCR_LLM_MODEL=$OCR_LLM_MODEL"
            if [[ -n "${OCR_USE_ANTHROPIC:-}" ]]; then
              echo "OCR_USE_ANTHROPIC=$OCR_USE_ANTHROPIC"
            fi
          } >> "$GITHUB_ENV"
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.auth_token "$OCR_LLM_TOKEN"
          ocr config set llm.model "$OCR_LLM_MODEL"
          if [[ "${OCR_USE_ANTHROPIC:-}" == "true" ]]; then
            ocr config set llm.use_anthropic true
          fi
          ocr config set language English
          ocr llm test

      - name: OCR-audit every commit in the push
        env:
          JANUS_OCR_REQUIRED: "1"
          CI: "true"
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            # First push / manual dispatch: audit HEAD only.
            ./scripts/verification/ocr_audit_commit.sh "$AFTER"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "WARN: before=$BEFORE not in history; auditing HEAD only" >&2
            ./scripts/verification/ocr_audit_commit.sh "$AFTER"
            exit 0
          fi
          while IFS= read -r sha; do
            [[ -n "$sha" ]] || continue
            ./scripts/verification/ocr_audit_commit.sh "$sha"
          done < <(git rev-list --reverse "${BEFORE}..${AFTER}")

  judge-sidecar:
    # `gateway/sidecars/janus_judge` ships 12 pytest cases that nothing ran,
    # the same rot risk as the EUnit suites had. It is a separate Python
    # component with its own requirements, so it gets its own job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/sidecars/janus_judge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        # `.[dev]` brings in ruff, which lint_all.sh requires. The version is
        # pinned in pyproject.toml: ruff's formatter changes between minors, so
        # an unpinned install makes `ruff format --check` fail in CI on a tree
        # that passes locally (this happened: 0.7.4 vs 0.17.3).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m ruff --version

      - name: Install SPA dependencies
        # BEFORE the lint step: lint_all.sh runs the SPA typecheck and build
        # when spa/node_modules exists, so installing after it would skip the
        # type gate while still reporting success.
        working-directory: dashboard/spa
        run: npm ci

      - name: Lint (Python + SPA)
        run: bash scripts/lint_all.sh

      - name: Typecheck (SPA)
        working-directory: dashboard/spa
        run: npm run typecheck

      - name: Build (SPA)
        working-directory: dashboard/spa
        run: npm run build

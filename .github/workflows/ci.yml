name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  erlang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24"

      - name: Restore rebar cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: rebar-${{ runner.os }}-otp27-${{ hashFiles('rebar.lock') }}
          restore-keys: rebar-${{ runner.os }}-otp27-

      - name: Compile
        run: rebar3 compile

      - name: Format check
        run: rebar3 fmt --check

      - name: EUnit
        run: rebar3 eunit

  # Slice C: prove the prebuilt test image (the documented Windows-local
  # workflow) is self-contained — compile is baked in, no source mount.
  # If mirrors.aliyun.com is unreachable from a runner, override with
  # --build-arg APK_MIRROR=https://dl-cdn.alpinelinux.org
  eunit-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t janus-build:test .

      - name: Format check and EUnit (no source mount)
        run: docker run --rm janus-build:test sh -c 'rebar3 fmt --check && rebar3 eunit'

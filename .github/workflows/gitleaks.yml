name: gitleaks

# Merge-to-main policy (2026-10-14): secret scanning on main merges
# and tags only — develop/feature pushes are not built (budget).
on:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for scan

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
